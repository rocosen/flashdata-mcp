name: Apify Google Search
on:
  push:
    paths: ['integrations/apify/**', '.github/workflows/apify.yml']
  pull_request:
    paths: ['integrations/apify/**', '.github/workflows/apify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/apify/google-search
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: integrations/apify/google-search/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: docker build -f .actor/Dockerfile -t flashdata-google-search:ci .
