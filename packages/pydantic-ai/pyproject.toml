[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-flashdata"
version = "0.1.0"
description = "Google and YouTube research capability for Pydantic AI using FlashData MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "FlashData"}]
dependencies = ["pydantic-ai-slim[mcp]>=2.61,<2.62", "fastmcp-slim>=4.1.3,<5", "httpx2>=2.16,<3"]
keywords = ["pydantic-ai", "capability", "mcp", "google-search", "youtube-transcript"]

[project.urls]
Homepage = "https://flashdata.dev"
Documentation = "https://github.com/rocosen/flashdata-mcp/tree/main/packages/pydantic-ai"
Source = "https://github.com/rocosen/flashdata-mcp"
Issues = "https://github.com/rocosen/flashdata-mcp/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-socket>=0.7,<1", "build>=1.2,<2", "twine>=6,<8", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_flashdata"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
